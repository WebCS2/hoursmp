<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hour SMP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
            color: #fff;
            overflow-x: hidden;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #4CAF50;
            text-shadow: 0 0 10px #4CAF50;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            animation: fadeIn 1s ease;
        }

        .section {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 12px;
            margin-top: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .section:hover {
            transform: translateY(-3px);
        }

        button {
            background: #4CAF50;
            border: none;
            padding: 14px 22px;
            color: white;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .copy-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            border: none;
            background: #222;
            color: #fff;
        }

        /* Popup */
        .popup-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .popup {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 12px;
            width: 380px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            animation: popIn 0.3s ease;
        }

        .rank-option {
            background: #333;
            padding: 14px;
            margin-top: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .rank-option:hover {
            background: #444;
            transform: scale(1.03);
        }

        /* Cookie popup */
        #cookiePopup {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,20,0.95);
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1>Hour SMP</h1>
</header>

<div class="container">

    <div class="section">
        <h2>About the Server</h2>
        <p>
            Welcome to Hour SMP — a fun, active SMP server supporting both old and new Minecraft versions.
            Cracked players are welcome too. Join the adventure!
        </p>
    </div>

    <div class="section">
        <h2>Server IP</h2>
        <div class="copy-box">
            <input id="serverIP" value="hoursmp.aternos.me" readonly>
            <button onclick="copyIP()">Copy</button>
        </div>
        <p id="statusText" style="margin-top:10px;">Checking server status...</p>
    </div>

    <div class="section">
        <h2>Ranks</h2>
        <button onclick="openRankMenu()">Buy Ranks</button>
    </div>

</div>

<!-- Rank Popup -->
<div class="popup-bg" id="popupBg">
    <div class="popup" id="popupContent"></div>
</div>

<!-- Cookie Popup -->
<div id="cookiePopup">
    <p>Please accept cookies to continue.</p>
    <button onclick="acceptCookies()">Accept</button>
</div>

<script>
    // Cookie popup
    function acceptCookies() {
        document.getElementById("cookiePopup").style.display = "none";
    }

    // Copy IP
    function copyIP() {
        navigator.clipboard.writeText("hoursmp.aternos.me");
        alert("Copied!");
    }

    // Server status check
    async function checkStatus() {
        try {
            let res = await fetch("https://api.mcsrvstat.us/2/hoursmp.aternos.me");
            let data = await res.json();
            document.getElementById("statusText").innerText =
                data.online ? "Server is ONLINE" : "Server is OFFLINE";
        } catch {
            document.getElementById("statusText").innerText = "Unable to check status.";
        }
    }
    checkStatus();

    // Rank menu system
    function openRankMenu() {
        showPopup(`
            <h3>Select a Rank</h3>
            <div class="rank-option" onclick="selectRank('VIP')">VIP</div>
            <div class="rank-option" onclick="selectRank('+VIP')">+VIP</div>
        `);
    }

    function selectRank(rank) {
        showPopup(`
            <h3>${rank}</h3>
            <p>Enter your Minecraft name and Discord name</p>
            <input id="mcName" placeholder="Minecraft Name"><br><br>
            <input id="dcName" placeholder="Discord Name"><br><br>
            <p style="color: orange;">MUST BE IN THE DISCORD SERVER</p>
            <button onclick="rankBoostStep()">Continue</button>
        `);
    }

    function rankBoostStep() {
        let mc = document.getElementById("mcName").value;
        let dc = document.getElementById("dcName").value;

        if (!mc || !dc) {
            alert("Please fill both fields.");
            return;
        }

        showPopup(`
            <h3>Requirement</h3>
            <p>You need 1 Discord server boost to get this rank.</p>
            <button onclick="finalStep()">Okay</button>
        `);
    }

    function finalStep() {
        showPopup(`
            <h3>Final Step</h3>
            <p>Please boost the server to get the rank.</p>
            <p>After boosting, create a ticket to claim your rank.</p>
            <button onclick="closePopup()">Close</button>
        `);
    }

    function showPopup(html) {
        document.getElementById("popupBg").style.display = "flex";
        document.getElementById("popupContent").innerHTML = html;
    }

    function closePopup() {
        document.getElementById("popupBg").style.display = "none";
    }
</script>

</body>
</html>
