<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hour SMP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #1a1a1a;
            border-bottom: 2px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 40px;
            letter-spacing: 2px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .section {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #333;
        }

        button {
            background: #4CAF50;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .copy-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            border: none;
        }

        /* Popup */
        .popup-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            border: 1px solid #333;
        }

        .rank-option {
            background: #333;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .rank-option:hover {
            background: #444;
        }

        /* Cookie popup */
        #cookiePopup {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #222;
            padding: 20px;
            text-align: center;
            border-top: 2px solid #444;
        }
    </style>
</head>
<body>

<header>
    <h1>Hour SMP</h1>
</header>

<div class="container">

    <div class="section">
        <h2>About the Server</h2>
        <p>
            Welcome to Hour SMP. This is an SMP server with a lot of fun and way more.
            It supports older and newer versions of Minecraft. It supports cracked too.
        </p>
    </div>

    <div class="section">
        <h2>Server IP</h2>
        <div class="copy-box">
            <input id="serverIP" value="hoursmp.aternos.me" readonly>
            <button onclick="copyIP()">Copy</button>
        </div>
        <p id="statusText" style="margin-top:10px;">Checking server status...</p>
    </div>

    <div class="section">
        <h2>Ranks</h2>
        <button onclick="openRankMenu()">Buy Ranks</button>
    </div>

</div>

<!-- Rank Popup -->
<div class="popup-bg" id="popupBg">
    <div class="popup" id="popupContent"></div>
</div>

<!-- Cookie Popup -->
<div id="cookiePopup">
    <p>Please accept cookies to continue.</p>
    <button onclick="acceptCookies()">Accept</button>
</div>

<script>
    // Cookie popup
    function acceptCookies() {
        document.getElementById("cookiePopup").style.display = "none";
    }

    // Copy IP
    function copyIP() {
        navigator.clipboard.writeText("hoursmp.aternos.me");
        alert("Copied!");
    }

    // Server status check (simple ping)
    async function checkStatus() {
        try {
            let res = await fetch("https://api.mcsrvstat.us/2/hoursmp.aternos.me");
            let data = await res.json();
            document.getElementById("statusText").innerText =
                data.online ? "Server is ONLINE" : "Server is OFFLINE";
        } catch {
            document.getElementById("statusText").innerText = "Unable to check status.";
        }
    }
    checkStatus();

    // Rank menu system
    function openRankMenu() {
        showPopup(`
            <h3>What rank do you want to buy?</h3>
            <div class="rank-option" onclick="selectRank('VIP')">VIP</div>
            <div class="rank-option" onclick="selectRank('+VIP')">+VIP</div>
        `);
    }

    function selectRank(rank) {
        showPopup(`
            <h3>${rank}</h3>
            <p>Enter your Minecraft name and Discord name</p>
            <input id="mcName" placeholder="Minecraft Name"><br><br>
            <input id="dcName" placeholder="Discord Name"><br><br>
            <p style="color: orange;">MUST BE IN THE DISCORD SERVER</p>
            <button onclick="rankBoostStep()">Continue</button>
        `);
    }

    function rankBoostStep() {
        let mc = document.getElementById("mcName").value;
        let dc = document.getElementById("dcName").value;

        if (!mc || !dc) {
            alert("Please fill both fields.");
            return;
        }

        showPopup(`
            <h3>Requirement</h3>
            <p>You need 1 boost on the Discord server to get the rank.</p>
            <button onclick="finalStep()">Okay</button>
        `);
    }

    function finalStep() {
        showPopup(`
            <h3>Final Step</h3>
            <p>Please boost the server to get the rank.</p>
            <p>After you boost, please DM the owner of the server to give you the rank.</p>
            <button onclick="closePopup()">Close</button>
        `);
    }

    function showPopup(html) {
        document.getElementById("popupBg").style.display = "flex";
        document.getElementById("popupContent").innerHTML = html;
    }

    function closePopup() {
        document.getElementById("popupBg").style.display = "none";
    }
</script>

</body>
</html>
